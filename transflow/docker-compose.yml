version: "3.8"
services:
  app:
    build: .
    container_name: transflow_app
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
    depends_on:
      - mongo
      - redis
      - rabbitmq

  worker:
    build: .
    container_name: transflow_worker
    command: ["python", "-u", "src/consumer.py"]
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
    depends_on:
      - mongo
      - redis
      - rabbitmq

  mongo:
    image: mongo:6.0
    container_name: transflow_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: transflow_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: transflow_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mongo_data:
